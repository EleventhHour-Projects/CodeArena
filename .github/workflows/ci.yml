name: CI – Tests

on:
  push:
    branches: ["main", "dev", "staging"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go – Executor Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-executor-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code-executor-service/go.mod
          cache-dependency-path: code-executor-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build (catch compile errors)
        run: go build ./...

      - name: Run unit tests
        run: |
          go test ./utils/... ./api/... ./worker/... \
            -v \
            -count=1 \
            -race \
            -timeout 60s \
            -coverprofile=coverage.out \
            -covermode=atomic

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload Go coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: code-executor-service/coverage.out

  nextjs-tests:
    name: Next.js – Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0
        continue-on-error: true   # Don't fail CI on lint warnings, just report

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload Next.js coverage report
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-coverage
          path: my-app/coverage/

  nextjs-build:
    name: Next.js – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    needs: nextjs-tests   # Only build if tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Provide dummy secrets so Next.js doesn't fail on missing env vars
          NEXTAUTH_SECRET: "ci-dummy-secret"
          NEXTAUTH_URL: "http://localhost:3000"
          MONGODB_URI: "mongodb://localhost:27017/test"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  ci-status:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [go-tests, nextjs-tests, nextjs-build]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.go-tests.result }}" != "success" ] || \
             [ "${{ needs.nextjs-tests.result }}" != "success" ] || \
             [ "${{ needs.nextjs-build.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI checks passed ✓"
