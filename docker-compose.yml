services:
  express-server:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    ports:
      - "6767:6767"
    env_file:
      - ./websocket/.env
    # Override for Docker network
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis

  executor-service:
    build:
      context: ./code-executor-service
      dockerfile: Dockerfile
    ports:
      - "6969:6969"
      - "6970:6970"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./questions:/questions
    env_file:
      - ./code-executor-service/.env
    # Override for Docker network
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WSSIP=http://express-server:6767/internal/event
    depends_on:
      - redis
  frontend-service:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./questions:/questions
    env_file:
      - ./my-app/.env.local
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BOT_SERVICE_URL=http://bot-service:8000
    depends_on:
      - redis
      - express-server
      - executor-service

  bot-service:
    build:
      context: ./bot
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://executor-service:6969
      - APP_URL=http://frontend-service:3000
      - MATCHMAKING_WSS_URL=wss://matchmake.codearena.pro
      - BATTLE_WSS_URL=ws://express-server:6767
    depends_on:
      - frontend-service
      - executor-service
      - express-server

  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
