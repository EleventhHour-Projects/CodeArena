services:
  express-server:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    ports:
      - "6767:6767"
    env_file:
      - ./websocket/.env
    # Override for Docker network
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  executor-service:
    build:
      context: ./code-executor-service
      dockerfile: Dockerfile
    ports:
      - "6969:6969"
      - "6970:6970"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./questions:/questions
    env_file:
      - ./code-executor-service/.env
    # Override for Docker network
    environment:
      - REDIS_ADDR=redis:6379
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin&replicaSet=rs0
      - WSSIP=http://express-server:6767/internal/event
    depends_on:
      - redis
      - mongodb

  frontend-service:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./questions:/questions
    env_file:
      - ./my-app/.env.local
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/code-arena?authSource=admin&replicaSet=rs0
    depends_on:
      - redis
      - express-server
      - executor-service
      - mongodb

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

  mongodb-setup:
    image: mongo:latest
    depends_on:
      - mongodb
    restart: on-failure
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    entrypoint: |
      bash -c "
      echo 'Waiting for mongodb...'
      until mongosh --host mongodb --eval 'db.adminCommand({ping: 1})' &>/dev/null; do
        sleep 1
      done
      echo 'Initiating replica set...'
      mongosh --host mongodb -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]})'
      "

volumes:
  mongodb_data:
