services:
  express-server:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    ports:
      - "6767:6767"
    env_file:
      - ./websocket/.env
    # Override for Docker network
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  executor-service:
    build:
      context: ./code-executor-service
      dockerfile: Dockerfile
    ports:
      - "6969:6969"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./questions:/questions
    env_file:
      - ./code-executor-service/.env
    # Override for Docker network
    environment:
      - REDIS_ADDR=redis:6379
      - WSSIP=http://express-server:6767/internal/event
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
