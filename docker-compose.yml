services:
  express-server:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    ports:
      - "6767:6767"
    env_file:
      - ./websocket/.env
    # Override for Docker network
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  executor-service:
    build:
      context: ./code-executor-service
      dockerfile: Dockerfile
    ports:
      - "6969:6969"
      - "6970:6970"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./questions:/questions
    env_file:
      - ./code-executor-service/.env
    # Override for Docker network
    environment:
      - REDIS_ADDR=redis:6379
      - MONGO_URI=mongodb://mongodb:27017
      - WSSIP=http://express-server:6767/internal/event
    depends_on:
      - redis
      - mongodb

  frontend-service:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./questions:/questions
    env_file:
      - ./my-app/.env.local
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongodb:27017/code-arena
    depends_on:
      - redis
      - express-server
      - executor-service
      - mongodb

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
